name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify all
        run: npm run verify:all
      - name: Verify asset import authority browser flow
        run: npm run verify:asset-import
      - name: Verify instruction writeback in Chromium
        run: node packages/editor/e2e/instruction-writeback.e2e.mjs
      - name: Verify V4 mounted production adapters in Chromium
        run: node packages/editor/e2e/v4-workbench.e2e.mjs
      - name: Verify V4 built editor and actual preview
        env:
          SURDET_V4_SCREENSHOTS: artifacts/v4-ui
        run: node packages/editor/e2e/v4-app.e2e.mjs
      - name: Retain Pass 10 Editor review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surdet-v4-ui
          path: artifacts/v4-ui/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: P1/P2 policy
        run: npm run verify:p1p2:policy
      - name: Verify modern Starter and generated project
        timeout-minutes: 10
        env:
          SURDET_STARTER_OUTPUT: artifacts/starter-ui
          SURDET_NEW_PLAYER_OUTPUT: artifacts/starter-ui/new-project
        run: npm run verify:starter
      - name: Retain modern Starter player evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surdet-starter-player
          path: artifacts/starter-ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Pass 8 actual player and file save bridge
        timeout-minutes: 15
        env:
          SURDET_PASS8_OUTPUT: artifacts/pass8-ui
        run: |
          npm run build -w @surdet/shell
          node packages/renderer/e2e/pass8-player.e2e.mjs
      - name: Retain three Pass 8 player review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surdet-pass8-player
          path: |
            artifacts/pass8-ui/01-reading.png
            artifacts/pass8-ui/02-settings.png
            artifacts/pass8-ui/03-save-load.png
          if-no-files-found: ignore
          retention-days: 7
