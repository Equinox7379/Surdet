<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surdet 预览</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0f16; }
      #preview-root {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 0;
      }
      #preview-root canvas {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }
      #preview-error { color: #ff8080; font: 13px/1.6 "Microsoft YaHei", sans-serif; padding: 8px 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="preview-root"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
